name: Deploy

# Triggers only after the CI workflow finishes on main/master.
# No real infrastructure is touched — "deployment" here means
# "this commit's tests passed and the codebase is verified".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── Staging ────────────────────────────────────────────────────────────────
  # Runs automatically after every green CI run on main.
  # The `environment:` key makes GitHub create a Deployment record and
  # update its status to success/failure based on this job's outcome.
  staging:
    name: staging
    runs-on: ubuntu-latest
    # Only proceed when CI actually passed — not on failure/cancellation.
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: https://letsrecall.ru

    steps:
      - name: Mark staging as verified
        run: |
          echo "commit : ${{ github.event.workflow_run.head_sha }}"
          echo "branch : ${{ github.event.workflow_run.head_branch }}"
          echo "CI run : ${{ github.event.workflow_run.html_url }}"
          echo ""
          echo "All tests and linting passed — staging verified ✓"

  # ── Production ─────────────────────────────────────────────────────────────
  # Runs after staging succeeds.
  # Add required reviewers to the "production" environment in
  #   Settings → Environments → production → Protection rules
  # to get a manual approval gate before this job starts.
  production:
    name: production
    runs-on: ubuntu-latest
    needs: staging
    environment:
      name: production
      url: https://letsrecall.ru

    steps:
      - name: Mark production as verified
        run: |
          echo "commit : ${{ github.event.workflow_run.head_sha }}"
          echo "branch : ${{ github.event.workflow_run.head_branch }}"
          echo "CI run : ${{ github.event.workflow_run.html_url }}"
          echo ""
          echo "All tests and linting passed — production verified ✓"
