[tool.poetry]
name = "recall-back"
description = ""
authors = ["AntonTsoy <tcoy210@gmail.com>"]
readme = "README.md"
version = "0.2.1"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.36"
fastapi = {extras = ["standard"], version = "^0.115.3"}
python-multipart = "^0.0.17"
pydantic-settings = "^2.6.1"
asyncpg = "^0.30.0"
psycopg = "^3.2.3"
psycopg-binary = "^3.2.3"
python-jose = "^3.3.0"
bcrypt = "^4.2.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
uvicorn = "^0.33.0"
ollama = "^0.4.7"
miniopy-async = "^1.22.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
ruff = "^0.6.9"
aiosqlite = "^0.20.0"
pytest-env = "^1.1.3"
greenlet = "^3.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# F403: star imports — used intentionally in every __init__.py
per-file-ignores = { "__init__.py" = ["F403", "F401"] }
